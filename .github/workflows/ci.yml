
name: CI Pico Park

on:
  push:
    branches:
      - main

jobs:
  construir-imagen:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Iniciar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: servidor/Dockerfile
          push: true
          tags: ariana939/picopark-server:latest

  desplegar-vm:
    needs: construir-imagen
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en la VM por SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            cd /home/Ariana/pico-park-ws
            docker compose pull
            docker compose up -d
