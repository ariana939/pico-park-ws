services:
  picopark-server:
    image: ariana939/picopark-server:latest
    build:
      context: .
      dockerfile: servidor/Dockerfile
    container_name: picopark-servidor
    ports:
      - "3001:3000"
    environment:
      - HOST_PUBLICO=10.56.31.30
      - PUERTO_PUBLICO=3001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

